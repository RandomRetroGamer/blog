<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | CampusConnect</title>
</head>
<body>
    <h1>Reset your password</h1>
    <p>Enter the email address associated with your account.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset email</button>
    </form>

    <p><a href="{% url 'login' %}">Back to login</a></p>
</body>
</html>
