<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choose a New Password | CampusConnect</title>
</head>
<body>
    {% if validlink %}
        <h1>Choose a new password</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change password</button>
        </form>
    {% else %}
        <h1>Reset link unavailable</h1>
        <p>This password-reset link is invalid or has expired.</p>
        <p><a href="{% url 'password_reset' %}">Request a new link</a></p>
    {% endif %}
</body>
</html>
