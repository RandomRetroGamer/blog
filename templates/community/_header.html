<!-- site header, shared by every page. -->
<header class="site_header">
    <div class="nav_container">
        <a href="{% url 'home' %}" class="logo">
            <span class="logo_mark" aria-hidden="true">CC</span>
            <span class="logo_text">Campus Connect</span>
        </a>
        <nav class="account_nav">
            <a href="{% url 'home' %}">Discussions</a>
            <a href="{% url 'group_list' %}">Groups</a>
            <a href="{% url 'event_list' %}">Events</a>
            <a href="{% url 'about' %}">About</a>
            {% if user.is_staff %}
                <a href="{% url 'create_event' %}">Create event</a>
            {% endif %}
            {% if user.is_authenticated %}
                <a href="{% url 'bookmarks' %}">Bookmarks</a>
                <span>Signed in as {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'signup' %}">Create account</a>
            {% endif %}
        </nav>
    </div>


</header>
