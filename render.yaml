databases:
  - name: campus-connect-db
    databaseName: campus_connect
    user: campus_connect
    plan: free

services:
  - type: web
    name: campus-connect
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: campus-admin
      - key: ADMIN_EMAIL
        value: admin@campusconnect.invalid
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: campus-connect-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: SECURE_SSL_REDIRECT
        value: "true"
